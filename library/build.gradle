plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'com.incode.sdk'
version = '1.1.0-incode.1'

android {
    compileSdk = 36
    namespace = 'com.incode.jp2'
    defaultConfig {
        minSdk 16
        targetSdk 33
        consumerProguardFiles 'consumer-rules.pro'
        aarMetadata {
            minCompileSdk = 36
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version '3.22.1'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    ndkVersion = '23.2.8568313'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

/*************************************************************/
/******************* PUBLISHING STUFF ************************/
/*************************************************************/
publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group
            artifactId = 'jp2-android'
            version = project.version
            afterEvaluate {
                from components.release
            }
            pom {
                name = 'Incode JP2ForAndroid'
                description = 'Incode fork of Thales JP2ForAndroid 1.1.0 with OpenJPEG 2.5.4'
                inceptionYear = '2019'
                url = 'https://github.com/Incode-Technologies-Example-Repos/JP2ForAndroid'
                licenses {
                    license {
                        name = 'The 2-Clause BSD License'
                        url = 'https://opensource.org/licenses/BSD-2-Clause'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'Michal Dvorak'
                        url = 'https://github.com/michaldvorak-gemalto'
                    }
                    developer {
                        name = 'Incode Android SDK Team'
                        organization = 'Incode'
                        organizationUrl = 'https://incode.com'
                    }
                }
                scm {
                    url = 'https://github.com/Incode-Technologies-Example-Repos/JP2ForAndroid'
                    connection = 'scm:git:https://github.com/Incode-Technologies-Example-Repos/JP2ForAndroid.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'staging'
            url = rootProject.layout.buildDirectory.dir('staging-repo')
        }
    }
}
