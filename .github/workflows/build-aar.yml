name: Build decoder AAR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decoder-aar-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle/wrapper/gradle-wrapper.properties

      - name: Install Android build tools
        run: >-
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          "ndk;23.2.8568313" "cmake;3.22.1"

      - name: Build, lint, and stage the release AAR
        run: >-
          ./gradlew --no-daemon :jp2-android:assembleRelease
          :jp2-android:lintRelease :jp2-android:publishReleasePublicationToStagingRepository

      - name: Record artifact checksum and source commit
        run: |
          sha256sum library/build/outputs/aar/jp2-android-release.aar > build/aar-sha256.txt
          git rev-parse HEAD > build/source-commit.txt

      - name: Upload the AAR and Maven files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jp2-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            library/build/outputs/aar/jp2-android-release.aar
            build/staging-repo/
            build/aar-sha256.txt
            build/source-commit.txt

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jp2-lint-${{ github.sha }}
          retention-days: 30
          path: library/build/reports/lint-results-release.*
