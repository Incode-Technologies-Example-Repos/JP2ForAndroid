apply plugin: 'com.android.application'

def codecFromStaging = providers.gradleProperty('codecFromStaging').map { it.toBoolean() }.getOrElse(false)

if (codecFromStaging) {
    repositories {
        maven {
            url = rootProject.layout.buildDirectory.dir('staging-repo')
            content {
                includeGroup 'com.incode.sdk'
            }
        }
    }
}

android {
    compileSdk = 36
    namespace = "com.incode.jp2.test"

    defaultConfig {
        applicationId "com.incode.jp2.testapp"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            //TODO update the path to your keystore and the related variables
            if (project.hasProperty('defaultKeyStoreFile')) storeFile file(defaultKeyStoreFile)
            if (project.hasProperty('defaultKeyStorePassword')) storePassword defaultKeyStorePassword
            if (project.hasProperty('defaultKeyAlias')) keyAlias defaultKeyAlias
            if (project.hasProperty('defaultKeyPassword')) keyPassword defaultKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.22'
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    if (codecFromStaging) {
        implementation "com.incode.sdk:jp2-android:${project(':jp2-android').version}"
    } else {
        implementation project(':jp2-android')
    }
    implementation 'dev.keiji.jp2:jp2-android:1.0.5'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
}
